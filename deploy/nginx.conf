# TLS-terminating reverse proxy for the Heka identity platform.
# See docs/HTTPS-Support-Plan.md (§2.1) and docs/https-local-dev.md.
#
# Routing follows the plan's topology:
#   https://heka.localhost/       -> heka-sso-web-ui static (dist/)
#   https://heka.localhost/idw/   -> heka-identity-service-web-ui static (build/)
#   https://heka.localhost/api/       -> heka-identity-service:3000 (prefix stripped)
#   https://heka.localhost/agent-http -> heka-identity-service:3001 (prefix stripped)
#   https://heka.localhost/agent-ws   -> heka-identity-service:3002 (prefix stripped, WS)
#   https://heka.localhost/openid     -> heka-identity-service:3003 (prefix stripped)
#   https://heka.localhost/auth/      -> heka-auth-service:3004 (prefix stripped;
#                                        the app serves /api/v1 under APP_PREFIX=api)
#   https://sso.localhost/            -> heka-sso-service:3005 (own hostname —
#                                        discovery URLs derive from forwarded Host)
#   https://kc.localhost/             -> keycloak:8080
#
# Upstreams are referenced through variables + the Docker embedded DNS
# resolver: static proxy_pass hostnames resolve once at nginx startup, so a
# recreated backend container (new IP) would 502 until nginx restarts.
# Variables force per-request resolution. Variable proxy_pass carries no URI
# part, so prefix stripping is done with explicit rewrites.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # WebSocket upgrade passthrough
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS — mkcert-generated cert covering all public hostnames
    # (docs/https-local-dev.md)
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Sized for credential-exchange payloads (plan §2.1 hardening)
    client_max_body_size 10m;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # http -> https redirect
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ---------------------------------------------------------------------
    # heka.localhost — path-prefixed fan-out
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name heka.localhost localhost;

        set $identity_rest http://heka-identity-service:3000;
        set $identity_didcomm http://heka-identity-service:3001;
        set $identity_ws http://heka-identity-service:3002;
        set $identity_oid4vc http://heka-identity-service:3003;
        set $auth http://heka-auth-service:3004;

        add_header Strict-Transport-Security "max-age=31536000" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # heka-sso-web-ui built output (demo RP)
        root /usr/share/nginx/sso-web;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # heka-identity-service-web-ui built output.
        # NOTE: assets resolve only once the bundle is built with
        # publicPath=/idw/ (plan §3.3.2, Phase 4).
        location /idw/ {
            alias /usr/share/nginx/idw/;
            try_files $uri $uri/ /idw/index.html;
        }

        # identity-service REST API (:3000) — /api stripped
        location /api/ {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass $identity_rest;
        }

        # DIDComm HTTP (:3001) — wallets POST to the bare endpoint
        location = /agent-http {
            rewrite ^.*$ / break;
            proxy_pass $identity_didcomm;
        }
        location /agent-http/ {
            rewrite ^/agent-http(/.*)$ $1 break;
            proxy_pass $identity_didcomm;
        }

        # DIDComm WebSocket (:3002) — prefix stripped, WS upgrade.
        # location-level proxy_set_header cancels server-level inheritance,
        # so the full header set is repeated here.
        location = /agent-ws {
            rewrite ^.*$ / break;
            proxy_pass $identity_ws;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        # OID4VCI / OID4VP (:3003) — /openid stripped
        location = /openid {
            rewrite ^.*$ / break;
            proxy_pass $identity_oid4vc;
        }
        location /openid/ {
            rewrite ^/openid(/.*)$ $1 break;
            proxy_pass $identity_oid4vc;
        }

        # auth-service (:3004) — /auth stripped; the app itself serves
        # /api/v1/... (APP_PREFIX=api), so /auth/api/v1/... -> /api/v1/...
        location /auth/ {
            rewrite ^/auth(/.*)$ $1 break;
            proxy_pass $auth;
        }
    }

    # ---------------------------------------------------------------------
    # sso.localhost — heka-sso-service on its own hostname.
    # node-oidc-provider derives discovery endpoint URLs from the forwarded
    # Host header (plan §3.4.3) — Host must be preserved, no path prefix.
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name sso.localhost;

        set $sso http://heka-sso-service:3005;

        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            proxy_pass $sso;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # future /interaction/*/events push (INTEGRATION.md:350)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }

    # ---------------------------------------------------------------------
    # kc.localhost — Keycloak (KC_PROXY_HEADERS=xforwarded in compose)
    # ---------------------------------------------------------------------
    server {
        listen 443 ssl;
        server_name kc.localhost;

        set $keycloak http://keycloak:8080;

        location / {
            proxy_pass $keycloak;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
