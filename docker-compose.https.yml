# Root-level compose used EXCLUSIVELY for serving the platform over HTTPS.
# See docs/HTTPS-Support-Plan.md (§2.1) and docs/https-local-dev.md.
#
# The per-service compose files remain the plain-HTTP standalone dev workflow;
# this file does not replace them.
#
# NOTE: the plan originally called for `include:` of the per-service compose
# files, but all three define a service named `postgres`, and Compose merges
# included files into a single project where duplicate service names are a
# hard error. Services are therefore defined flat here, mirroring the
# per-service files.
#
# Backend ports (3000-3005, 8080) are still published to the host in Phase 1
# so the existing plain-HTTP flows keep working (e.g. the Keycloak realm's
# host.docker.internal:3005 backchannel URLs). They are removed in Phase 5.

name: heka-https

services:
  # ------------------------------------------------------------------ nginx
  nginx:
    image: nginx:alpine
    ports:
      - '443:443'
      - '80:80'
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      # Built web-UI output. Phase 4 replaces these mounts with proper
      # Dockerfiles; until the UIs are built the locations serve 404s.
      - ./heka-sso-web-ui/dist:/usr/share/nginx/sso-web:ro
      - ./heka-identity-service-web-ui/build:/usr/share/nginx/idw:ro
    depends_on:
      - heka-auth-service
      - heka-identity-service
      - heka-sso-service
      - keycloak
    networks:
      default:
        aliases:
          # Public hostnames resolve to the proxy from inside the compose
          # network — required for Keycloak's backchannel calls once the
          # realm moves to the https issuer (plan §2.6).
          - heka.localhost
          - sso.localhost
          - kc.localhost

  # ------------------------------------------------------ heka-auth-service
  auth-postgres:
    image: postgres:15
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_USER=heka
      - POSTGRES_PASSWORD=heka1
      - POSTGRES_DB=heka-auth-service

  heka-auth-service:
    image: heka-auth-service:latest
    build: ./heka-auth-service
    environment:
      - APP_VERSION=${APP_VERSION:-0.0.1}
      - APP_PORT=3004
      - APP_ENABLE_CORS=true
      - ORG_ID=633890ba-ceff-4989-ad44-44f1d003d809
      - LOG_LEVEL=info
      - LOG_EXCLUDE_URLS=/version,/health
      - DB_HOST=auth-postgres
      - DB_PORT=5432
      - DB_NAME=heka-auth-service
      - DB_USER=heka
      - DB_PASSWORD=heka1
      - JWT_ISSUER=Heka
      - JWT_AUDIENCE=Heka Identity Service
      - JWT_SECRET=test
      - JWT_ACCESS_EXPIRY=3600
      - JWT_REFRESH_EXPIRY=86400
      - DEMO_USER=demo
    ports:
      - '3004:3004'
    depends_on:
      - auth-postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3004/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # -------------------------------------------------- heka-identity-service
  identity-postgres:
    image: postgres:15
    shm_size: '256m'
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=heka
      - POSTGRES_PASSWORD=heka1
      - POSTGRES_DB=heka-identity-service

  heka-identity-service:
    image: heka-identity-service:latest
    build: ./heka-identity-service
    environment:
      MIKRO_ORM_HOST: identity-postgres
      WALLET_POSTGRES_HOST: identity-postgres
      # Phase 1 keeps the http endpoint defaults; Phase 2 switches these to
      # the public https/wss URLs (plan §2.2).
      AGENT_HTTP_ENDPOINT: ${AGENT_HTTP_EP:-http://localhost:3001}
      AGENT_WS_ENDPOINT: ${AGENT_WS_EP:-ws://localhost:3002}
    ports:
      - '3000:3000'
      - '3001:3001'
      - '3002:3002'
      - '3003:3003'
    depends_on:
      - identity-postgres

  # --------------------------------------------------------- heka-sso-service
  sso-postgres:
    image: postgres:15
    ports:
      - '5434:5432'
    environment:
      - POSTGRES_USER=heka
      - POSTGRES_PASSWORD=heka1
      - POSTGRES_DB=heka-sso-service

  # Env mirrors heka-sso-service/docker-compose.dev.yml (the Keycloak demo
  # needs OIDC_CLIENTS + the dev-only stub login).
  heka-sso-service:
    image: heka-sso-service:latest
    build: ./heka-sso-service
    environment:
      - APP_VERSION=0.0.1
      - APP_PORT=3005
      - APP_ENABLE_CORS=true
      - LOG_LEVEL=trace
      - LOG_EXCLUDE_URLS=/version,/health
      - DB_HOST=sso-postgres
      - DB_PORT=5432
      - DB_NAME=heka-sso-service
      - DB_USER=heka
      - DB_PASSWORD=heka1
      - OIDC_ISSUER_URL=http://localhost:3005
      - OIDC_COOKIE_KEYS=dev-only-cookie-key-do-not-use-in-production
      - OIDC_SUB_HMAC_SALT=dev-only-sub-hmac-salt-do-not-use-in-production
      - IDENTITY_SERVICE_BASE_URL=http://heka-identity-service:3000
      - OIDC_CLIENTS=[{"clientId":"keycloak-broker","clientSecret":"dev-only-broker-secret-do-not-use-in-production","redirectUris":["http://localhost:8080/realms/heka/broker/heka-sso/endpoint","http://localhost:8080/realms/master/broker/heka-sso/endpoint"],"postLogoutRedirectUris":["http://localhost:8080/realms/heka/broker/heka-sso/endpoint/logout_response","http://localhost:8080/realms/master/broker/heka-sso/endpoint/logout_response"],"loginConfigId":"default"}]
      - OIDC_LOGIN_CONFIGS=[{"id":"default","verificationTemplate":"default","claimMapping":{"mdl.given_name":"given_name","mdl.family_name":"family_name","mdl.age_over_18":"age_over_18"},"subStrategy":"derived","issuerAllowlist":[]}]
      # Dev-only stub login (INTEGRATION.md P1.3) — refused in production
      - OIDC_STUB_LOGIN=true
    ports:
      - '3005:3005'
    depends_on:
      - sso-postgres
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3005/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------- keycloak
  # Lifted from heka-sso-service/docker-compose.dev.yml (plan §2.1.1).
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      # Trust X-Forwarded-* from nginx when accessed via https://kc.localhost
      - KC_PROXY_HEADERS=xforwarded
    ports:
      - '8080:8080'
    volumes:
      - ./heka-sso-service/keycloak:/opt/keycloak/data/import:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
