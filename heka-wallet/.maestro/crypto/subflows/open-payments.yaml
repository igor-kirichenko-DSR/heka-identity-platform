# Fresh install -> onboarding -> Payments tab, on the register screen.
# The tab id comes with F06 (host wiring); input: env PIN, plus the onboard.yaml login env for external-auth builds.
appId: com.heka.wallet
---
- runFlow: ../../subflows/onboard.yaml
- tapOn:
    id: 'com.ariesbifold:id/TabPayments'
- extendedWaitUntil:
    visible:
      id: 'com.ariesbifold:id/CryptoCreateWallet'
    timeout: 30000
