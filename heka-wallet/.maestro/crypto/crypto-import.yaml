appId: com.heka.wallet
name: A payment wallet is imported from a private key and Home opens
# Not in a CI suite yet: needs the Payments tab from F06. The key is random per run and holds no funds.
tags:
  - crypto
  - no-backend
env:
  PIN: '482916'
---
- runFlow: subflows/open-payments.yaml
- evalScript: ${output.key = '0x' + Array.from({ length: 64 }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('')}
- runFlow:
    file: subflows/import-key.yaml
    env:
      KEY: ${output.key}
- assertVisible:
    id: 'com.ariesbifold:id/CryptoBalance-ETH'
# A raw-key wallet has no phrase to reveal.
- tapOn:
    id: 'com.ariesbifold:id/CryptoSettings'
# Settings must be open first, or the absence check below would pass on any screen.
- assertVisible:
    id: 'com.ariesbifold:id/CryptoRemoveWallet'
- assertNotVisible:
    id: 'com.ariesbifold:id/CryptoRevealPhrase'
