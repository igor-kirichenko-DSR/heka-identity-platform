appId: com.heka.wallet
name: Receive shows the QR code and copies the address
# Needs a build with ENABLE_CRYPTO_MODULE=true (the Payments tab).
tags:
  - crypto
  - no-backend
env:
  PIN: '482916'
---
- runFlow: subflows/open-payments.yaml
- evalScript: "${output.key = '0x' + Array.from({ length: 64 }, () => '0123456789abcdef'[Math.floor(Math.random() * 16)]).join('')}"
- runFlow:
    file: subflows/import-key.yaml
    env:
      KEY: ${output.key}
- tapOn:
    id: 'com.ariesbifold:id/CryptoReceive'
- assertVisible:
    id: 'com.ariesbifold:id/CryptoReceiveQr'
- tapOn:
    id: 'com.ariesbifold:id/CryptoAsset-USDC'
- assertVisible:
    id: 'com.ariesbifold:id/CryptoReceiveQr'
- scrollUntilVisible:
    element:
      id: 'com.ariesbifold:id/CryptoCopyAddress'
- tapOn:
    id: 'com.ariesbifold:id/CryptoCopyAddress'
- assertVisible: 'Copied'
